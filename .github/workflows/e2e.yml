name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: Playwright (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      # Build-time placeholders. The E2E suite is unauthenticated and never
      # talks to a real backend, but the app's modules reference these env vars,
      # so we provide syntactically valid dummies to let `next build` succeed.
      NEXT_PUBLIC_SUPABASE_URL: 'https://example.supabase.co'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'dummy-anon-key'
      SUPABASE_SERVICE_ROLE_KEY: 'dummy-service-role-key'
      JWT_SECRET: 'ci-e2e-dummy-jwt-secret-not-used-for-real-auth'
      NEXT_PUBLIC_APP_URL: 'http://localhost:3000'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        # playwright.config.ts builds + starts `next start` via webServer.
        run: npx playwright test --reporter=list

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
