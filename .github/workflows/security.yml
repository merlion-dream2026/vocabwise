name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run every Monday at 08:00 UTC (15:00 Vietnam time)
    - cron: '0 8 * * 1'

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Fail only on critical — Next.js was upgraded 14->16.3.5 to close the prior critical
      # bundle (DoS Image Optimizer, AVIF RCE, cache poisoning, request smuggling, CSP-nonce
      # XSS, SSRF). Remaining high-severity findings are dev-only deps (vitest, eslint-config-next
      # transitive deps) not shipped to production.
      - name: Run audit (fail on critical only)
        run: npm audit --audit-level=critical

  typecheck:
    name: TypeScript check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit
