name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run every Monday at 08:00 UTC (15:00 Vietnam time)
    - cron: '0 8 * * 1'

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - run: npm ci
      # Fail only on critical — remaining high-severity findings are in next@14 (Vercel-hosted,
      # so self-hosted DoS/cache CVEs don't apply) and dev-only deps (eslint-config-next, minimatch).
      # Nodemailer SSRF (GHSA-p6gq-j5cr-w38f) was fixed by upgrading to 9.x.
      # Next.js major upgrade (14→16) is tracked separately.
      - name: Run audit (fail on critical only)
        run: npm audit --audit-level=critical

  typecheck:
    name: TypeScript check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit
