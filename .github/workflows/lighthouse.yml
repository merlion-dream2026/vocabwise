name: Lighthouse CI

on:
  # Run after Vercel reports the production deploy live (not on push, which
  # raced the rollout and hit a half-deployed site → NO_NAVSTART).
  deployment_status:
  workflow_dispatch:

jobs:
  lighthouse:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Lighthouse CI against production
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            https://vocabwise.id.vn/
            https://vocabwise.id.vn/login
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: '.lighthouserc.json'
