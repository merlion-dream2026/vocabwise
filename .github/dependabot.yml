version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Group minor/patch updates together to reduce PR noise
      non-major:
        update-types:
          - minor
          - patch
    ignore:
      # Hold major versions — review manually
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      # eslint 10 breaks peer dep with eslint-config-next@14; upgrade together with Next
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: eslint-config-next
        update-types: [version-update:semver-major]
      # tailwindcss v4 has breaking changes; migrate intentionally
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
